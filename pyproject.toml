[project]
name = "baldrick-2"
version = "0.1.0"
description = "CLI generator for low-level navigation map and route kneeboards for DCS World"
requires-python = ">=3.13"
dependencies = [
    "haversine>=2.9.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.2",
    "pyinstaller>=6.20.0",
    "pyvips[binary]>=3.1.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "typer>=0.24.1",
]
[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
